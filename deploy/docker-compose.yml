services:
  bookshelf-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: home-bookshelf-api
    restart: unless-stopped
    ports:
      - "${BOOKSHELF_BIND:-127.0.0.1:8000}:8000"
    volumes:
      - ${BOOKSHELF_DATA_DIR:-../data}:/data
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/bookshelf.db
      DATA_DIR: /data
      PORT: "8000"
    healthcheck:
      # BUG-167：/health 已要求认证，healthcheck 改打免认证的 /public-health（最小可用性探活）
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/public-health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
