[pytest]
# TST-002：根目录 pytest 配置，将测试发现重定向到 backend/tests
# 使开发者可在项目根目录直接运行 pytest，无需先 cd backend
# CHK-056：tests/scripts（批量导入/识书评测脚本测试）一并纳入，避免提交后失修
testpaths = backend/tests tests/scripts
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning:starlette.*
